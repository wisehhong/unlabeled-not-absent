[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unlabeled-not-absent"
version = "0.1.0"
description = "Small FathomNet + SAM 3 proof of concept"
readme = "PROTOTYPE.md"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2024.7.4",
  "numpy>=1.26",
  "Pillow>=10",
]

[project.scripts]
una-poc = "unlabeled_not_absent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
