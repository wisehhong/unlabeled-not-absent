[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unlabeled-not-absent"
version = "0.2.0"
description = "FathomNet incomplete-annotation audit prototype with YOLO and SAM 3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2024.7.4",
  "numpy>=1.26",
  "Pillow>=10",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]

[project.scripts]
una-poc = "unlabeled_not_absent.cli:main"

[tool.setuptools.packages.find]
where = ["src", "prototype/src"]

[tool.pytest.ini_options]
testpaths = ["prototype/tests"]
